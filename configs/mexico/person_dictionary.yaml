# Person-level dictionary for mexico (EOD 2017 ZMVM, INEGI). Raw data: TSDEM.DBF.
# Travel questions (P4_2/P4_3) are only asked of persons aged 6+; younger
# children are counted in hh_size but have no travel diary and are excluded.

column_mappings:
  ID_SOC: pid
  ID_HOG: hid
  FACTOR: weight
  EDAD: age
  SEXO: sex
  PARENTESCO: relationship
  NIV: education
  P3_7: employment  # condición de actividad la semana pasada
  P3_8: worked_anyway  # for P3_7 not 1/2: did they work in some other way?
  P4_2: weekday_travel  # 1 travelled on the weekday, 2 did not, null not asked
  P4_3: saturday_travel  # 1 travelled on Saturday, 2 did not, null not asked

# sex mapping
  # Valid values: male, female, other, unknown
sex:
  1: male  # hombre
  2: female  # mujer

# relationship mapping (PARENTESCO, relative to the jefe(a) del hogar)
  # Valid values: self, partner, child, parent, sibling, unrelated, relative, other, unknown
relationship:
  1: self  # jefe(a)
  2: partner  # esposo(a) o compañero(a)
  3: child  # hijo(a)
  4: relative  # nieto(a)
  5: relative  # otro parentesco
  6: unrelated  # sin parentesco

# education mapping (NIV, highest level reached; secundaria is lower
# secondary, preparatoria upper secondary)
  # Valid values: some, none, school, high-school, degree, unknown, void
education:
  0: none  # ninguno
  1: none  # preescolar o kinder
  2: school  # primaria
  3: school  # secundaria
  4: high-school  # carrera técnica con secundaria terminada
  5: high-school  # normal básica
  6: high-school  # preparatoria o bachillerato
  7: high-school  # carrera técnica con preparatoria terminada
  8: degree  # licenciatura o profesional
  9: degree  # maestría o doctorado
  99: unknown  # no sabe

# employment mapping (P3_7). Persons answering P3_8 codes in
# worked_anyway_codes (sold goods, provided a paid service, helped in a family
# business) are reclassified as employed.
  # Valid values: employed, unemployed, retired, student, unknown, void
employment:
  1: employed  # trabajó
  2: employed  # tenía trabajo, pero no trabajó
  3: unemployed  # buscó trabajo
  4: student  # es estudiante
  5: unemployed  # quehaceres del hogar o cuidar a sus hijos
  6: retired  # jubilado(a) o pensionado(a)
  7: unemployed  # incapacitado(a) permanentemente para trabajar
  8: unemployed  # no trabajó

worked_anyway_codes: [1, 2, 3]  # 4: entonces, no trabajó
