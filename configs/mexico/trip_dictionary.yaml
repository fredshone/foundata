# Trip-level dictionary for mexico (EOD 2017 ZMVM, INEGI).
# TVIAJE.DBF holds one row per trip, TTRANSPORTE.DBF one row per mode used
# (stage) of each trip. Every person aged 6+ reports a weekday diary and a
# Saturday diary; each diary becomes its own plan (person-day).
# The survey records no distances or coordinates, only ~194 districts, so
# distance is the sum over stages of stage duration x mode speed.

column_mappings:
  TVIAJE:
    ID_VIA: tid
    ID_SOC: pid
    P5_3: diary  # 1 entre semana, 2 sábado
    N_VIA: seq  # 1-indexed within each diary
    P5_6: oact  # tipo de lugar de origen
    P5_13: dact  # propósito del viaje
    P5_11A: dest_place  # tipo de lugar de destino
    DTO_ORIGEN: ozone
    DTO_DEST: dzone
    P5_9_1: tst_h  # 99 no sabe
    P5_9_2: tst_m
    P5_10_1: tet_h
    P5_10_2: tet_m
  TTRANSPORTE:
    ID_VIA: tid
    P5_14: mode
    P5_16: stage  # order the mode was used in
    P5_16_1_1: duration_h  # includes waiting and transfer time; 99 no sabe
    P5_16_1_2: duration_m

# diary (P5_3) -> day. Weekday diaries are a Tuesday, Wednesday or Thursday
# but the day isn't recorded. Fieldwork ran 23 Jan - 3 Mar 2017, also not
# recorded per household, so month is left null.
  # Valid values: monday, tuesday, wednesday, thursday, friday, saturday, sunday, unknown
day:
  1: unknown  # viaje realizado entre semana
  2: saturday  # viaje realizado en sábado

# dact mapping (P5_13, propósito)
  # Valid values: home, work, education, shop, leisure, visit, escort, other, unknown
dact:
  1: home  # ir al hogar
  2: work  # ir al trabajo
  3: education  # ir a estudiar
  4: shop  # ir de compras (bienes y servicios)
  5: leisure  # convivir (amigos o familiares), deportes o recreación
  6: escort  # llevar o recoger a alguien
  7: other  # hacer un trámite
  8: other  # ir al médico o recibir atención de salud
  9: other  # ir a acto religioso
  10: other  # otro
  99: unknown  # no sabe

# Leisure trips (convivir...) whose destination is someone else's home
# (P5_11A 07, otra vivienda) become visit.
visit_place: 7

# oact mapping (P5_6, type of place at origin), used for the first trip of
# each diary only; later trips take the previous trip's dact.
  # Valid values: home, work, education, shop, leisure, visit, escort, other, unknown
oact:
  1: home  # su hogar
  2: education  # escuela
  3: work  # oficina
  4: work  # fábrica o taller
  5: shop  # comercio, mercado, tienda o centro comercial
  6: leisure  # centro cultural o área recreativa
  7: visit  # otra vivienda
  8: other  # hospital, clínica, consultorio, laboratorio clínico
  9: shop  # restaurante, bar, cafetería
  10: leisure  # deportivo, gimnasio
  11: other  # bases o estaciones de transporte público
  12: work  # obra en construcción
  13: other  # otros servicios
  14: other  # recinto religioso
  15: other  # vía pública
  16: other  # otro
  99: unknown  # no sabe

# mode mapping (P5_14, per stage)
  # Valid values: walk, bike, car, bus, rail, other, unknown
mode:
  1: car  # automóvil
  2: bus  # colectivo/micro
  3: car  # taxi (app internet)
  4: car  # taxi (sitio, calle u otro)
  5: rail  # metro
  6: bus  # autobús RTP o M1
  7: bike  # bicicleta
  8: bus  # autobús
  9: car  # moto
  10: bus  # trolebús
  11: bus  # metrobús o mexibús (BRT)
  12: rail  # tren ligero
  13: rail  # tren suburbano
  14: walk  # caminar en la calle
  15: other  # mexicable (cable car)
  16: other  # bicitaxi
  17: car  # mototaxi
  18: bus  # transporte escolar
  19: bus  # transporte de personal
  20: other  # otro

# A trip's mode is the highest-priority mode among its stages.
mode_priority: [rail, bus, car, other, bike, walk]

# Average speed (km/h) per raw mode, applied to stage durations. Transit
# stage durations include waiting and transfers, so their speeds are
# door-to-stop averages rather than in-vehicle speeds.
speed:
  1: 22  # automóvil (congested metro-area average)
  2: 14  # colectivo/micro
  3: 22  # taxi (app)
  4: 22  # taxi
  5: 25  # metro
  6: 14  # autobús RTP o M1
  7: 12  # bicicleta
  8: 18  # autobús (incl. suburban routes)
  9: 28  # moto
  10: 13  # trolebús
  11: 18  # metrobús o mexibús
  12: 20  # tren ligero
  13: 35  # tren suburbano
  14: 5  # caminar
  15: 15  # mexicable
  16: 8  # bicitaxi
  17: 15  # mototaxi
  18: 18  # transporte escolar
  19: 25  # transporte de personal
  20: 15  # otro

# District codes with no location: 888 fuera de la ZMVM, 999 distrito no
# especificado. These (and districts with no sampled residents) get
# ozone/dzone unknown.

# trip end locations (see foundata.location): the origin and destination
# EOD districts (DTO_ORIGEN/DTO_DEST); work in progress, as for homes
origin_location:
  - level: eod_district
    code: [{column: ozone, width: 3}]
    valid: '\d{3}'
destination_location:
  - level: eod_district
    code: [{column: dzone, width: 3}]
    valid: '\d{3}'
