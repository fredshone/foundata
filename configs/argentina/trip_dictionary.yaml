# Trip-level dictionary for argentina (see hh_dictionary.yaml for the surveys).
# Each survey has a trips table (one row per viaje) and a stages table (one
# row per modo / etapa). The diary is the weekday before the interview, from
# 04:00 to 04:00 the next morning. Personal trips under 400 m were recorded
# with their activities only (no times in Salta, no end time in Santa
# Fe-Paraná); filter.null_times then drops the whole plan.
# There are no coordinates or distances, so distance is the sum over stages
# of stage time x mode speed.

column_mappings:
  salta:
    trips:
      ID_VIAJE: tid
      ID_CP: pid
      CPVIAJE: seq  # 1-indexed
      Act_orig: oact
      Act_dest: dact
      Hora_minuto_Origen: tst  # clock time
      Hora_minuto_Destino: tet
      Loc_origen: ozone  # localidad
      Loc_dest: dzone
      Día_viaje: travel_day
      Mes_viaje: travel_month
      Año_viaje: travel_year  # 2-digit
    stages:
      ID_VIAJE: tid
      CPETAPA: stage
      Modo: mode
      Tiempo_transporte: duration  # minutes in the mode
  rc:
    trips:
      ID_VIAJE: tid
      ID_CP: pid
      VI_viaje_nro: seq
      VI_actividad_origen: oact
      VI_actividad_destino: dact
      VI_horario_origen_hora: tst_h
      VI_horario_origen_minuto: tst_m
      VI_horario_destino_hora: tet_h
      VI_horario_destino_minuto: tet_m
      VI_origen: ozone
      VI_destino: dzone
      VI_dia: travel_day
      VI_mes: travel_month
      VI_ano: travel_year
    stages:
      ID_VIAJE: tid
      VII_etapa_nro: stage
      VII_tipo_medio: mode
      VII_tiempo_transporte: duration
  nq:
    trips:
      ID_VIAJE: tid
      ID_CP: pid
      Viaje_Nro: seq
      Act_Origen: oact
      Act_Destino: dact
      Hora_origen: tst  # clock time
      Hora_destino: tet
      Loc_Origen: ozone
      Loc_Destino: dzone
      Fecha: travel_date
    stages:
      ID_VIAJE: tid
      Etapa_Nro: stage
      Tipo_Modo: mode
      Tiempo_modo: duration  # -96 unknown
  sfp:
    trips:
      ID_VIAJE: tid
      ID_CP: pid
      CPVIAJE: seq
      C06A06A: oact
      C06A06B: dact
      C06A05H: tst_h
      C06A05MI: tst_m
      C06A09H: tet_h
      C06A09MI: tet_m
      C06A07A: ozone
      C06A08A: dzone
      C06A05D: travel_day
      C06A05M: travel_month
      C06A05A: travel_year  # 2-digit
    stages:
      ID_VIAJE: tid
      CPETAPA: stage
      C07A01: mode
      C07A16: duration
  enmodo:
    trips:
      IDV: tid
      IDP: pid
      # no trip number: trips are ordered by start time
      ACTIORIG: oact
      ACTIDEST: dact
      HORASALI: tst_h  # 99999 Ns/Nc
      MINSALID: tst_m
      HORALLEG: tet_h
      MINLLEGA: tet_m
      TT_PARTIDO_ORIGEN: ozone
      TT_PARTIDO_DESTINO: dzone
      # no travel date
    stages:
      IDV: tid
      ETAPANUM: stage
      MODOTRAN: mode
      DURAHORA: duration_h  # 99 Ns/Nc
      DURAMINU: duration_m

# Times before day_start (minutes since midnight) belong to the end of the
# diary day and are moved past midnight.
day_start: 240

# Locality code meaning "the household's home" (its zone is hh_zone).
home_zone_code: 96

# Missing-value codes for stage times.
missing_codes: [-96, -95, 99]

# dact mapping (actividad en el destino); also used for the first trip's
# oact. Later oacts repeat the previous trip's dact.
  # Valid values: home, work, education, shop, leisure, visit, escort, other, unknown
dact:
  default:
    -97: other  # otros
    1: home  # hogar
    2: work  # trabajo (lugar de)
    3: work  # asunto laboral
    4: education  # estudios (lugar donde cursa)
    5: education  # estudio (otros lugares)
    6: escort  # dejar / buscar o acompañar a miembro del hogar a centro educativo
    7: other  # salud
    8: shop  # compras
    9: leisure  # social
    10: visit  # familia
    11: leisure  # deportes y recreación
    12: other  # personal / trámite personal
    13: other  # ir a buscar empleo
    14: escort  # dejar / buscar o acompañar a miembro del hogar a otro lugar
    15: escort  # dejar / buscar o acompañar a no miembro del hogar
    16: other  # pagos / bancos (Salta, Resistencia-Corrientes)
  enmodo:
    1: home  # hogar
    2: work  # lugar de trabajo
    3: work  # asunto laboral
    4: education  # cursar estudios
    5: education  # estudios (otros)
    6: other  # salud
    7: shop  # compras
    8: leisure  # deportes
    9: leisure  # recreación
    10: shop  # gastronomía
    11: visit  # amigos
    12: visit  # familia
    13: leisure  # social
    14: other  # culto
    15: other  # personal
    16: other  # trámites personales
    17: escort  # dejar, recoger o acompañar a miembro del hogar a centro educativo
    18: escort  # dejar, recoger o acompañar a miembro del hogar a otro lugar
    19: escort  # dejar, recoger o acompañar a no miembro del hogar
    20: other  # otro

# mode mapping (per stage). Motorbikes, taxis and remises are car.
  # Valid values: walk, bike, car, bus, rail, other, unknown
mode:
  default:  # Neuquén-Cipolletti, Santa Fe-Paraná
    -97: other  # otro
    1: walk  # a pie
    2: bike  # bicicleta
    3: bus  # colectivo
    4: car  # auto conductor
    5: car  # auto acompañante
    6: car  # moto / ciclomotor
    7: car  # taxi
    8: car  # remis
    9: bus  # charter / combi
    10: bus  # bus de la empresa
    11: bus  # transporte escolar
  salta:
    -97: other  # otro
    1: walk  # a pie
    2: bike  # bicicleta
    3: bus  # colectivo
    4: car  # auto conductor
    5: car  # auto acompañante
    6: car  # moto / ciclomotor
    7: car  # taxi
    8: car  # remis autorizado
    9: car  # remis no autorizado
    10: bus  # bus de la empresa
    11: bus  # transporte escolar
  rc:
    -97: other  # otro
    1: walk  # a pie
    2: bike  # bicicleta
    3: bus  # colectivo
    4: rail  # tren
    5: car  # auto conductor
    6: car  # auto acompañante
    7: car  # moto / ciclomotor
    8: car  # taxi
    9: car  # remis autorizado
    10: car  # remis no autorizado
    11: bus  # bus de la empresa
    12: bus  # transporte escolar
  enmodo:
    1: car  # automóvil / conductor
    2: car  # automóvil / acompañante
    3: car  # taxi
    4: car  # remis
    5: bus  # colectivo
    6: rail  # subte / premetro
    7: rail  # ferrocarril
    8: bus  # charter / combi
    9: bus  # bus empresa
    10: bus  # transporte escolar
    11: car  # motocicleta
    12: bike  # bicicleta
    13: walk  # a pie
    14: other  # lancha colectiva
    15: other  # otros

# A trip's mode is the highest-priority mode among its stages.
mode_priority: [rail, bus, car, other, bike, walk]

# Average speed (km/h) per template mode, applied to stage times. Stage
# times are time in the mode (waiting is asked separately), so these are
# in-vehicle speeds. Buenos Aires is more congested than the other cities.
speed:
  default:
    walk: 5
    bike: 12
    bus: 16
    car: 28
    rail: 30
    other: 15
  enmodo:
    walk: 5
    bike: 12
    bus: 14
    car: 22
    rail: 30
    other: 15

