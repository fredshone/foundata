    2: suburban  # Cipolletti
    3: suburban  # Centenario
    4: suburban  # Allen
    5: suburban  # Plottier
    6: suburban  # Cinco Saltos
    7: suburban  # General Fernández Oro
    8: suburban  # Senillosa
    9: suburban  # San Patricio del Chañar
    10: suburban  # Campo Grande
    11: suburban  # Vista Alegre
    12: rural  # Contraalmirante Cordero
  sfp:
    1: urban  # Santa Fe centro
    2: urban  # Santa Fe resto
    3: suburban  # Santa Fe conurbano
    4: urban  # Paraná centro
    5: urban  # Paraná resto
    6: suburban  # Paraná conurbano
  enmodo:
    # Ciudad de Buenos Aires (distritos escolares 1-21) and the 24 partidos
    # of Gran Buenos Aires are urban; the outer partidos are suburban.
    901: urban
    902: urban
    903: urban
