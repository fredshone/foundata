# Household-level dictionary for MONG (Mongolia Time Use Survey, NSO), rounds
# 2023, 2019 and 2011. Every key is year-keyed (read with
# utils.config_for_year); "default" applies to rounds without their own key.
# Labels are from each round's DDI; original Mongolian labels are quoted where
# the English translation is misleading. The 2015 round is not loaded: its
# diary activity classification is not published.
#
# Raw tables:
#   2023: 2023/hhdata_1.dta     (Stata)
#   2019: 2019/hh [en].sav      (SPSS)
#   2011: 2011/TUS HH_en.sav    (SPSS)
#
# No round asks about household income, so hh_income is null throughout.
# Vehicle ownership is recorded by type (yes/no), not counted -- see
# vehicle_columns.

column_mappings:
  "2023":
    hhid: hid                # intermediate -- prefixed in mong.py
    HH14: hh_size            # Total number of household members
    HH8: hh_zone             # Location (capital / aimag centre / soum centre / countryside)
    HC1: dwelling            # What is your type of accommodation?
    HC5: ownership           # Can you state the form of ownership of your residence?
  "2019":
    HH2: hid_cluster         # intermediate -- Cluster number; hid in mong.py
    HH3: hid_hh              # intermediate -- Household number; hid in mong.py
    HH13: hh_size            # Total number of household members
    HH4: hh_zone             # Location
    HC1: dwelling            # Dwelling type
    HC5: ownership           # Ownership of accomodation
  "2011":
    HH1: hid_cluster         # intermediate -- Cluster number; hid in mong.py
    HH2: hid_hh              # intermediate -- HH number; hid in mong.py
    HH15: hh_size            # Household size
    HH3: hh_zone             # Location
    HC1: dwelling            # Type of dwelling
    HC6: ownership           # DOES ANY MEMBER OF YOUR HOUSEHOLD OWN THIS DWELLING?

# Vehicle types the household owns (answered vehicle_yes_code). vehicles =
# number of these types owned, so a lower bound: two cars count once.
# Tractors are left out.
vehicle_columns:
  "2023":
    - CA1M  # DO YOU HAVE A (MOTORCYCLE/MOPED/SCOOTER)?
    - CA1N  # passenger car (Суудлын автомашин)
    - CA1O  # DO YOU HAVE A (MID-SIZE AND LARGE-SIZED SUV)?
    - CA1P  # DO YOU HAVE A (BUS/MICROBUS)?
    - CA1Q  # truck
  "2019":
    - CA3H  # Household has: Sedan car
    - CA3I  # Household has: Medium or large size Jeep
    - CA3J  # Household has: Bus/ microbus
    - CA3K  # Household has: Truck
    - CA3L  # Household has: Motorcycle
  "2011":
    - CA5_K  # Assets: Car/ sidan
    - CA5_L  # Assets: Bus/ minivan
    - CA5_M  # Assets: Truck
    - CA5_N  # Assets: Motorcycle
vehicle_yes_code:
  default: 1

# Last-resort mode for trips of a person who recorded no mode at all that
# day (see mong._trip_modes): the first mode the household has, in the order
# car > bus > bike > walk. car = owns any vehicle_columns type (a motorbike
# maps to car anyway), bus/bike = the column below answered vehicle_yes_code,
# walk otherwise. Only 2023 asks about bus use and bicycles; the other rounds
# have no fallback, so their trips without a recorded mode stay unknown.
mode_availability:
  default: null
  "2023":
    bus: TP1    # DOES ANY MEMBER OF YOUR HOUSEHOLD USE PUBLIC TRANSPORT (BUS)?
    bike: CA1L  # DO YOU HAVE A (RIDING BIKE)?

# hh_zone: follows NSO's own urban flag (urban = capital + aimag centres).
# Soum centres are small district towns, so they go with the countryside.
# Valid values: urban, suburban, rural, unknown
hh_zone:
  default:
    1: urban   # Нийслэл -- Capital city (Ulaanbaatar)
    2: urban   # Аймгийн төв -- Aimag (provincial) centre
    3: rural   # Сумын төв -- Soum centre
    4: rural   # Хөдөө -- Rural
    5: rural   # Хөдөө -- Rural (2023 only)

# Valid values: house, flat, other, unknown
dwelling:
  default: {}
  "2023":
    11: other  # Гэр -- ger (yurt); the DDI translates it as "Home"
    12: flat   # Орон сууцны байшин -- Apartment building
    13: house  # Бие даасан тохилог сууц -- Independent comfortable dwelling
    14: house  # Сууцны тусдаа байшин -- Detached house
    15: other  # Public housing (workers, students, etc.)
    16: other  # Non-designated housing
    96: other  # Other dwelling (write)
  "2019":
    1: flat    # Apartment, condominium
    2: house   # Convinient single family house
    3: house   # Single family house
    4: other   # Public accomodation, dormitory
    5: other   # Ger
    6: other   # Other (specify)
  "2011":
    11: flat   # Apartment, condomunium
    12: house  # Convinient single family house
    13: house  # Single family house
    14: other  # Public accomodation, dormitory
    15: other  # Other
    16: other  # Ger

# Valid values: owned, rented, other, unknown
ownership:
  default:
    1: owned   # Own
    2: rented  # Other's dwelling: rented
    3: other   # Other's dwelling: rent-free
    6: other   # Other
