# Matching NSS district names (configs/india/districts_<year>.csv) to LGD
# and Census 2011 district boundaries (scripts/build_location_lookups.py).
# Names are normalised first (lowercase letters only, "&" -> "and",
# bracketed text dropped except "(rural)"/"(urban)").
#
# names: NSS name -> boundary-file name; "<state>:<name>" where a name is
#   ambiguous across states. Also applied to names in the split table.
# extra_splits: districts carved out since 2021 that the split table
#   (ramSeraph District_splits_and_carveouts) leaves out.
# states: NSS state code -> LGD (Census 2011) state code, by survey year,
#   where they differ.
