# Dutch household income reference used by odin, ovin and om to put
# hh_income on one scale: annual GROSS household income (bruto inkomen,
# CBS definition: primary income plus transfers received, before income tax
# and social contributions).
#
# The surveys record disposable household income (ODiN, OViN) or personal
# net income (OM). Those are converted to gross by rank: a household at
# disposable percentile p gets the gross income at percentile p, by linear
# interpolation between that year's CBS decile boundaries below. Above P90
# the gross/disposable ratio at P90 (~1.8) is applied. Years outside the
# table use the nearest year (OM 2005-07 and OViN 2010 use 2011).
#
# Source: CBS StatLine, all private households incl. students:
#   83934NED "Welvaart; grenzen van 10%-groepen inkomen & vermogen"
#     (P10..P90 of besteedbaar and bruto inkomen, x 1 000 EUR);
#   83932NED "Inkomen van huishoudens; inkomensklassen" (mean gross income
#     of the top 10% group, for tail_alpha).
# 2011-2023 definitive, 2024 provisional (fetched 2026-10).

# Open-ended top bands (ODiN's top decile, OViN's EUR 50 000+, OM's
# personal EUR 30 000+) are sampled from a Pareto tail truncated at this
# gross value, the same for every source.
max_income: 500000

# Per year: P10..P90 boundaries in EUR, and the Pareto shape of the top
# tail, alpha = m / (m - P90) from the gross top-decile mean m. The same
# shape is used for every open band in that year: it agrees within ~0.1 with
# the shape fitted to OViN's disposable EUR 50 000+ band (2011-2017).
years:
  2011:
    disposable: [13700, 18100, 22200, 26400, 31300, 36900, 42900, 50700, 63400]
    gross: [17200, 23500, 30300, 38700, 48400, 59300, 71900, 88200, 114500]
    tail_alpha: 3.03   # top-decile gross mean 170.8k
  2012:
    disposable: [13700, 18100, 22300, 26500, 31400, 36900, 43100, 50900, 63700]
    gross: [17200, 23500, 30200, 38700, 48400, 59700, 72800, 89800, 117100]
    tail_alpha: 3.08   # top-decile gross mean 173.5k
  2013:
    disposable: [13700, 18100, 22300, 26500, 31400, 37100, 43500, 51500, 64500]
    gross: [17400, 23600, 30300, 38700, 48600, 60000, 73400, 90800, 118700]
    tail_alpha: 3.08   # top-decile gross mean 175.9k
  2014:
    disposable: [14200, 18700, 23000, 27200, 32200, 38100, 44800, 53100, 66700]
    gross: [17900, 24100, 30800, 39300, 49300, 61000, 74800, 92800, 122200]
    tail_alpha: 2.75   # top-decile gross mean 192.0k
  2015:
    disposable: [14400, 18800, 23200, 27400, 32500, 38600, 45500, 54000, 67500]
    gross: [18100, 24100, 30900, 39300, 49200, 60900, 74600, 92500, 121100]
    tail_alpha: 3.08   # top-decile gross mean 179.3k
  2016:
    disposable: [14800, 19400, 23800, 28200, 33400, 39900, 47300, 56200, 70400]
