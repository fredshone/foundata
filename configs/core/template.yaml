notes:
  default: |
    When default: True, "unknown" or null (for string fields) or null (for numeric fields)
    are acceptable values — they indicate missing/inapplicable data.
    When default: False or absent, every row must have a real value.
  id_prefix: |
    Loaders give pid and hid as strings unique within the source: the raw id,
    plus a year or survey tag where the source combines several surveys, e.g.
    "2022100012345". run.load_source then replaces them with int32 ids
    numbered from 0 (utils.enumerate_ids), and run.runner offsets them per
    source so they are unique across all surveys.
  time_format: |
    tst (trip start time) and tet (trip end time) are integers: minutes since
    midnight. Trips crossing midnight have values > 1440. Use fix.day_wrap() to
    handle these after computing tst/tet.
  distance_unit: km

attributes:
  hid:
    dtype: int32
    default: False
    min: 0
    description: "Household ID. Unique within the dataset."
  pid:
    dtype: int32
    default: False
    min: 0
    description: "Person ID. Unique within the dataset."
  age:
    dtype: int32
    default: True
    min: 0
    max: 120
    description: "Age in years."
  hh_size:
    dtype: int32
    default: True
    min: 1
    max: 100
    description: "Number of persons in the household."
  hh_income:
    dtype: int32
    default: True
    min: 0
    description: "Annual household income in euros. Use utils.sample_*_to_euro() for currency conversion from coded ranges."
  sex:
    dtype: str
    default: True
    set: [male, female, other, unknown]
    description: "Respondent sex."
  dwelling:
    dtype: str
    default: True
    set: [house, flat, other, unknown]
    description: "Type of dwelling the household lives in."
  ownership:
    dtype: str
    default: True
    set: [owned, rented, other, unknown]
    description: "Housing tenure."
  vehicles:
    dtype: int32
    default: True
    min: 0
    max: 100
    description: "Number of motorised vehicles available to the household."
  disability:
    dtype: str
    default: True
    set: ["yes", "no", unknown]
    description: "Whether the person has a disability affecting travel."
  education:
    dtype: str
    default: True
    set: [some, none, school, high-school, degree, unknown, void]
    description: "Highest education level attained."
  can_wfh:
    dtype: str
    default: True
    set: ["yes", "no", unknown, void]
    description: "Whether the person can work from home."
  occupation:
    dtype: str
    default: True
    set: [clerical, manual, managerial, operator, professional, service, other, technical, unknown, void]
    description: "Occupation category."
  race:
    dtype: str
    default: True
    set: [white, black, asian, non-white, other, multiracial, unknown]
    description: "Self-reported racial identity."
  has_licence:
    dtype: str
    default: True
    set: ["yes", "no", unknown, void]
    description: "Whether the person holds a driving licence."
  relationship:
    dtype: str
    default: True
    set: [self, partner, child, parent, sibling, unrelated, relative, other, unknown]
    description: "Relationship to the household reference person."
  employment:
    dtype: str
    default: True
    set: [employed, unemployed, retired, student, unknown, void]
    description: "Employment status. 'void' for children too young for employment status to apply (see utils.correct_child_employment())."
  employed_type:
    dtype: str
    default: True
    set: [ft, pt, void, unknown]
    description: "Full-time/part-time split of employment. 'void' when the split doesn't apply (not employed, or employed without a known ft/pt breakdown). Derived by utils.split_employment_type()."
  country:
    dtype: str
    default: True
    description: "ISO country code (e.g. 'usa', 'gbr', 'aus'). Set programmatically per source."
  continent:
    dtype: str
    default: True
    set: [north_americas, south_americas, europe, africa, asia, oceania]
    description: "Continent of the survey country. Set programmatically per source."
  source:
    dtype: str
    default: True
    description: "Survey source identifier (e.g. 'nhts', 'cmap'). Set programmatically per source."
  year:
    dtype: int
    default: True
    description: "Survey year. Set programmatically from the data or config."
  month:
    dtype: int
    default: True
    min: 1
    max: 12
    description: "Month of travel diary (1-12)."
  day:
    dtype: str
    default: True
    set: [monday, tuesday, wednesday, thursday, friday, saturday, sunday, unknown]
    description: "Day of week for the travel diary."
  hh_zone:
    dtype: str
    default: True
    set: [urban, suburban, rural, unknown]
    description: "Urban/rural classification of the household location."
  hh_location:
    dtype: int32
    default: True
    min: 0
    description: "Row (location_id) of locations.parquet holding the household's home location. Households (and trip ends) in the same zone share a row; null where the source gives no home location."
  weight:
    dtype: float32
    default: True
    min: 0
    description: "Survey expansion weight for the person/household."
  access_egress_distance:
    dtype: float32
    default: True
    min: 0
    description: "Expected distance (kms) of access egress for transit trips. Null for persons with no valid trips."
  max_temp_c:
    dtype: float
    default: True
    description: "Daily maximum temperature (°C) for the travel day. Null if unavailable."
  rain:
    dtype: bool
    default: True
    description: "Whether precipitation > 0 mm was recorded on the travel day. Null if unavailable."
  avg_speed:
    dtype: float32
    default: True
    min: 0
    description: "Average trip speed in km/h. Total distance / total duration across all valid trips. Null for persons with no valid trips."
  wt_gdp_per_capita:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): GDP per capita (USD PPP, constant 2021). Null without a home location."
  wt_ghsl_built_volume:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Built-up volume (m³, GHSL). Null without a home location."
  wt_gini:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Gini coefficient of income. Null without a home location."
  wt_hdi:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Human Development Index. Null without a home location."
  wt_ntl_harmonized:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Harmonized night-time lights (DMSP/VIIRS). Null without a home location."
  wt_population_density:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Population density (persons/km², GPWv4.11). Null without a home location."
  wt_tp_sum:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): ERA5 total precipitation, sum of the 12 monthly means of daily totals (m). Null without a home location."
  wt_t2m_mean:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): ERA5 mean 2 m air temperature (K). Null without a home location."
  wt_skt_max:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): ERA5 maximum skin temperature (K). Null without a home location."
  wt_elevation_mean:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Mean elevation (m, GMTED2010). Null without a home location."
  wt_travel_time_to_cities:
    dtype: float32
    default: True
    description: "WorldTensor at the home location (averaged over the 0.25° cells it covers) in the year nearest the survey year (see docs/gridjoin.md): Travel time to the nearest city (minutes, Weiss et al. 2018). Null without a home location."

trips:
  pid:
    dtype: int32
    default: None
    min: 0
    description: "Person ID, matching attributes.pid."
  seq:
    dtype: int8
    default: None
    min: 0
    description: "Trip sequence number within the person's travel day (0-indexed)."
  ozone:
    dtype: str
    default: True
    set: [urban, suburban, rural, unknown]
    description: "Urban/rural classification of the trip origin zone."
  dzone:
    dtype: str
    default: True
    set: [urban, suburban, rural, unknown]
    description: "Urban/rural classification of the trip destination zone."
  ocode:
    dtype: int32
    default: True
    min: 0
    description: "Row (location_id) of locations.parquet holding the trip origin's location; null where the source gives none."
  dcode:
    dtype: int32
    default: True
    min: 0
    description: "Row (location_id) of locations.parquet holding the trip destination's location; null where the source gives none."
  oact:
    dtype: str
    default: True
    set: [home, work, education, shop, leisure, visit, escort, other, unknown]
    description: "Activity at trip origin (what the person was doing before departing)."
  dact:
    dtype: str
    default: True
    set: [home, work, education, shop, leisure, visit, escort, other, unknown]
    description: "Activity at trip destination (purpose of the trip)."
  mode:
    dtype: str
    default: True
    set: [walk, bike, car, bus, rail, other, unknown]
    description: "Main transport mode used for this trip."
  tst:
    dtype: int
    default: None
    min: 0
    description: "Trip start time in minutes since midnight. Values >1440 indicate next-day continuation."
  tet:
    dtype: int
    default: None
    min: 0
    description: "Trip end time in minutes since midnight. Values >1440 indicate next-day continuation."
  distance:
    dtype: float32
    default: None
    min: 0
    description: "Trip distance in kilometres."
