# Trip-level dictionary for mongolia (Time Use Survey, NSO), rounds
# 2023, 2019 and 2011. Every key is year-keyed (utils.config_for_year).
#
# Raw diary tables (one row per episode):
#   2023: 2023/dairy_main_1.dta -- one 24h diary per respondent
#   2019: 2019/dairy [en].sav   -- 2-3 diary days per respondent
#   2011: 2011/TUS HD_en.sav    -- 2-3 diary days per respondent
# Every diary day runs 04:00 to 04:00 the next day on a 10-minute grid;
# consecutive slots with the same activity are merged into one episode.
# Respondents keep their diaries on assigned weekdays (Wed+Thu, Fri+Sat or
# Sun+Mon+Tue in 2011/2019), and each diary day becomes its own plan.
#
# The diary has no trips as such. mongolia.py builds them like the India TUS
# (india.py): travel episodes (travel_codes / escort_travel_codes) become
# trips, and the stationary episodes between two trips are squashed into the
# one activity with the most time. Each episode also has a place, used to
# add trips the diary leaves out (implied_trip) and to re-type "home"
# activities done somewhere else (home_act_away). The place code also gives
# the mode of travel: separately asked in 2023 (A9, for episodes on the
# road), part of the place code in 2011, and not recorded at all in 2019.
#
# There is no distance and no trip-level geography: distance is null and
# ozone/dzone are the household's own hh_zone.

column_mappings:
  "2023":
    pid: pid               # intermediate -- person id, prefixed in mongolia.py
    ID: episode            # intermediate -- episode number within the diary, 1..n
    A1STARTH: start_h      # intermediate -- Start time (hour)
    A1STARTM: start_m      # intermediate -- Starting minute
    A1FINISHH: end_h       # intermediate -- Finished time (hour)
    A1FINISHM: end_m       # intermediate -- Finished minute
    A2CODE: activity_code  # intermediate -- Main activity, ICATUS 2016 3-digit code
    A8: location           # intermediate -- Where was it?
    A9: mode_code          # intermediate -- How did you travel? (asked only when A8 = 8)
    HD7: day               # Diary Day (matches NSO's own derived weekday column)
    D1M: month             # Diary date (month)
  "2019":
    HD02: hid_cluster      # intermediate -- Primary sampling unit
    HD03: hid_hh           # intermediate -- Household number
    HD05: pid_line         # intermediate -- Respondent line number
    DAYID: day             # Diary weekday (1=Mon .. 7=Sun; "712" households keep Sun, Mon, Tue)
    ID: episode            # intermediate -- episode number, running across the person's diary days
    STARTHOUR: start_h     # intermediate -- main activity: start hour
    STARTMINUT: start_m    # intermediate -- main activity: start minute
    ENDHOUR: end_h         # intermediate -- main activity: end hour
    ENDMINUT: end_m        # intermediate -- main activity: end minute
    ACTIVITY_CODE: activity_code  # intermediate -- WHAT DO YOU DO? (Main activity), ICATUS 2016
    ID7: location          # intermediate -- WHERE HAVE YOU BEEN?
    HD10A_M: month         # Date of 1st visit (month), when the diary was handed out
  "2011":
    HH1: hid_cluster       # intermediate -- Cluster number
    HH2: hid_hh            # intermediate -- HH number
    HL1: pid_line          # intermediate -- Line number
    DAYID: day             # Diary weekday (1=Mon .. 7=Sun)
    ID: episode            # intermediate -- episode number, running across the person's diary days
    TOTALDURATION: duration  # intermediate -- episode duration (minutes); no clock times are given
    ID3_ACTIVITY: activity_code  # intermediate -- Main activity, national classification
    ID6: location          # intermediate -- Where/ mode of transportation
    HD9_1_MONTH: month     # First visit: month, when the diary was handed out

# How episode times are given: "clock" (start/end hour and minute) or
# "duration" (episodes in order from the 04:00 diary start).
time_format:
  default: clock
  "2011": duration

# Which column holds an episode's mode code (mapped by `mode`), read only
# for episodes at a road_locations place; null when no mode is recorded.
mode_column:
  default: null
  "2023": mode_code
  "2011": location

# Valid values: walk, bike, car, bus, rail, other, unknown
mode:
  default: {}
  "2023":   # A9: How did you travel?
    1: walk   # Алхсан -- Walked
    2: car    # Машинаар -- By car
    3: car    # Такси үйлчилгээгээр -- By taxi service
    4: bus    # Нийтийн тээврээр -- By public transport (bus/trolleybus)
    5: bike   # Унадаг дугуйгаар -- By bicycle
    6: car    # Мотоцикл, скүүтер, мопедоор -- By motorcycle, scooter, moped
    7: other  # Ердийн хөсгөөр (морь, тэмээ гэх мэт) -- Riding animals (horses, camels, etc.)
    8: other  # Бусад -- Other
  "2011":   # ID6: Where/ mode of transportation (transport codes)
    20: unknown  # Undefinable transport
    21: bus      # Bus
    22: car      # Car
    23: car      # Taxi
    24: rail     # Plane, train
    25: car      # Motorcycle
    26: other    # Horse, cart
    27: walk     # Walk
    28: other    # Other transport

# A trip's mode: the first of these used by any of its on-the-road
# episodes. A trip with no recorded mode (travel noted at another place, or
# an implied trip) takes the first of these the person used on any trip that
# diary day; failing that, the household's mode_availability (2023 only).
mode_priority:
  default: [rail, car, bus, other, bike, walk]

# Valid values: monday, tuesday, wednesday, thursday, friday, saturday, sunday, unknown
day:
  default:
    1: monday
    2: tuesday
    3: wednesday
    4: thursday
    5: friday
    6: saturday
    7: sunday

# Diary days are separate plans (pid = person id + weekday digit) where a
# respondent kept more than one.
pid_day_suffix:
  default: true
  "2023": false

# Place codes ("location" above).
#   2023 A8: 1 At home; 2 At work/school; 3 At someone else's home ("Family"
#     in the DDI); 4 Restaurant/bar/diner/karaoke; 5 In a store; 6 Church/
#     monastery; 7 Elsewhere; 8 On the road / in the countryside, steppe.
#   2019 ID7: 1 At home; 2 In work/ school; 3 On the way/ in transportation;
#     4 Other place.
#   2011 ID6: 0 Undefinable place/transport; 10 Undefinable place; 11 At
#     home; 12 Resting place, cottage; 13 Work, school; 14 Other's home;
#     15 Restaurant, eating house; 16 Market, shop; 17 Hotel, tourist camp;
#     18 Other place; 20-28 in transport (see mode).
# On the road / in transport: modes are read here, and the escort codes
# count as travel here.
road_locations:
  default: []
  "2023": [8]
  "2019": [3]
  "2011": [20, 21, 22, 23, 24, 25, 26, 27, 28]
# Places that are buildings: a move between two different ones always
# means a trip (see implied_trip).
fixed_places:
  "2023": [1, 2, 3, 4, 5, 6]
  "2019": [1, 2]
  "2011": [11, 12, 13, 14, 15, 16, 17]

# The place is not asked for most sleep and personal hygiene in 2023 (26% of
# episodes); a missing place is taken as home.
missing_location:
  default: 1
  "2011": 11

# A "home" activity (eating, sleeping, childcare, ...) done away from home is
# re-typed by where it happened.
home_act_away:
  "2023":
    2: other   # at work/school
    3: visit   # at someone else's home
    4: shop    # restaurant/bar (meals -> shop)
    5: shop    # in a store
    6: visit   # church/monastery (as religious practice, 742)
    7: other   # elsewhere
    8: other   # on the road / in the countryside
  "2019":
    2: other   # at work/school
    3: other   # on the way
    4: other   # other place
  "2011":
    0: other     # undefinable place/transport
    10: other    # undefinable place
    12: leisure  # resting place, cottage
    13: other    # work, school
    14: visit    # other's home
    15: shop     # restaurant (meals -> shop)
    16: shop     # market, shop
    17: leisure  # hotel, tourist camp
    18: other    # other place
    20: other
    21: other
    22: other
    23: other
    24: other
    25: other
    26: other
    27: other
    28: other

# Implied trips (see mongolia._add_implied_trips): a move between two
# consecutive stationary episodes at different places with no travel
# recorded. Between fixed_places it is always a trip; to or from anywhere
# else (elsewhere, on the road / countryside), only if the activity changes
# and the activity away is one of implied_trip.acts. The trip takes the last
# implied_trip.minutes of the earlier episode (at most half of it).
implied_trip:
  default:
    acts: [work, education, shop, leisure, visit, escort]
    minutes: 10

# Activity codes that are travel, wherever they were recorded.
travel_codes:
