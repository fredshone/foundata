# Person-level dictionary for mongolia (Time Use Survey, NSO), rounds
# 2023, 2019 and 2011. Every key is year-keyed (utils.config_for_year).
#
# Raw tables:
#   2023: 2023/ppdata_1.dta -- diary respondents only (ages 12+)
#   2019: 2019/hl [en].sav  -- household roster, every member
#   2011: 2011/TUS HL_en.sav (roster, every member) joined to
#         2011/TUS HQ_en.sav (individual questionnaire, ages 12+)
# Only members who kept a diary are kept (mongolia.py); hh_size comes from the
# household table, so it still counts everyone. day and month describe each
# diary day and come from the diary table (trip_dictionary.yaml).
#
# No round asks about driving licences, working from home or race.

column_mappings:
  "2023":
    hhid: hid                # intermediate -- prefixed in mongolia.py
    pid: pid                 # intermediate -- prefixed in mongolia.py
    HL6: age                 # FULL AGE
    HL4: sex                 # GENDER
    HL3: relationship        # RELATIONSHIP OF THE HEAD OF HOUSEHOLD
    ED4: education           # Highest education level completed
    occ_class_d1: occupation # Main occupation, ISCO-08 major group
    weight_pop: weight       # Sample weight (population)
  "2019":
    HH2: hid_cluster         # intermediate -- Cluster number
    HH3: hid_hh              # intermediate -- Household number
    HL1: pid_line            # intermediate -- Line number
    HL6: age                 # Age
    HL4: sex                 # Gender
    HL3: relationship        # Household head relationship
    ED3: education           # What is the highest level of (name)'s education completed?
    EP6_iscocode: occupation # ISCO code (4-digit)
    pweight: weight          # Person's sampling weight
  "2011":
    persons:                 # TUS HL_en.sav, the household roster
      HH1: hid_cluster       # intermediate -- Cluster number
      HH2: hid_hh            # intermediate -- Household number
      HL1: pid_line          # intermediate -- Line number
      HL6: age               # Age
      HL4: sex               # Sex
      HL3: relationship      # Relationship to household head
      weight: weight         # sampling weight (household-level: constant within each household)
    questionnaire:           # TUS HQ_en.sav, the individual questionnaire
      HH1: hid_cluster
      HH2: hid_hh
      HL1: pid_line
      ED5: education         # HIGHEST LEVEL OF EDUCATION
      EP5: occupation        # Main occupation, ISCO code (4-digit)
      HE2: disability        # DOES (name) HAVE ANY DISABILITY?

# ISCO codes are divided by this to get the major group (1 digit).
occupation_divisor:
  default: 1000
  "2023": 1

# Employment: rules applied in order, the first one whose column holds a
# listed code wins; anyone matching none is "unknown" (children under 15 are
# forced to "student" downstream by utils.correct_child_employment). Each
# rule is {raw column: {code: employment}}. For 2011 the columns are read
# from the questionnaire table.
employment_rules:
  "2023":
    # NSO's derived employed flag (1 = employed); counts herders who sell
    # produce, and people who also do housework
    - p_work: {1: employed}
    - EP18:  # WHICH ONE SUITS YOU IN YOUR CURRENT SITUATION?
        11: employed    # Working (for salary/income)
        12: unemployed  # Takes care of and treats his family at home
        13: student     # Learns
        14: student     # Unpaid intern
        15: unemployed  # Produces agricultural products for household consumption
        16: unemployed  # Looking for a job
        17: employed    # Serves in the military, police, or security forces
        18: unemployed  # Volunteering without pay
        19: retired     # Retired
        20: unemployed  # Sick and disabled
  "2019":
    - EP3: {1: employed}  # Check: did any paid work or own business/farming in the last 7 days
    - EP4: {1: employed}  # Has a paid job or business although did not work last week
    - ED1: {1: student}   # Currently attending school
    - EP14:  # Main reason not available to work
        1: unemployed  # Waiting recall from previous job
        2: unemployed  # Waiting for the season to start
        3: student     # School/ training
        4: unemployed  # Family/ household responsibilities
        5: unemployed  # Helping in agriculture for family use
        6: unemployed  # Disabled
        7: retired     # Retired
        9: unemployed  # Other
    - EP16:  # Why did not try to find a paid job
        1: student     # In school
        2: retired     # Retired
        3: unemployed  # Not able to work
        4: unemployed  # Household/ family responsibilities
        5: unemployed  # No jobs matching skill
        6: unemployed  # Myself not interested in work
        96: unemployed # Other
    - EP13: {1: unemployed, 2: unemployed}  # Would work if available (asked of all non-workers 15+)
  "2011":
    - EP1: {1: employed}  # Did any paid work at least one hour in the last 7 days
    - EP2: {1: employed}  # Did unpaid family work or was self-employed (incl. herding)
    - EP4: {1: employed}  # Has a job although did not work last week
    - ED2: {1: student}   # DOES (name) ATTEND SCHOOL?
    - EP20:  # WAS (name) AVAILABLE TO UNDERTAKE WORK DURING THE LAST 7 DAYS?
        1: unemployed  # Yes
        2: student     # Study
        3: retired     # Retired
        4: unemployed  # Sick
        5: unemployed  # Disabled
        6: unemployed  # Looking after children
        7: retired     # Old age
        8: unemployed  # Not interested to work
        9: unemployed  # Take care of elderly
        10: unemployed # Household duties

# Washington Group questions (1=No difficulty, 2=Some, 3=A lot, 4=Cannot):
# disability = "yes" if any is at least disability_threshold. 2011 has no
# such questions; it asks directly (HE2, mapped by `disability` below).
disability_columns:
  default: []
  "2023": [HE5, HE7, HE8, HE9, HE10, HE11]  # seeing, hearing, walking, remembering, self-care, communicating
  "2019": [HE2, HE4, HE5, HE6, HE7, HE8]    # same six domains
disability_threshold:
  default: 3

# Valid values: yes, no, unknown
disability:
  default: {}
  "2011":
    1: "yes"
    2: "no"

# Valid values: male, female, other, unknown
sex:
  default:
    1: male
    2: female

# Valid values: self, partner, child, parent, sibling, unrelated, relative, other, unknown
relationship:
  default:
    1: self       # Household head
    2: partner    # Spouse/partner
    3: child      # Son/daughter
    4: parent     # Parents
    5: sibling    # Brother/sister
    6: relative   # Parent-in-law
    7: relative   # Son/daughter-in-law (2011: brother/sister-in-law)
    8: relative   # Grandparents
    9: relative   # Grandchildren (2011: nephew/niece)
    10: relative  # Other relatives
    11: unrelated # Not related

# Valid values: some, none, school, high-school, degree, unknown, void
education:
  default: {}
  "2023":
    1: none         # Боловсролгүй -- Uneducated
    2: school       # Бага -- Primary
    3: school       # Суурь -- Lower secondary (basic, grade 9)
    4: high-school  # Бүрэн дунд -- Complete secondary (grade 12)
    5: high-school  # Техникийн болон мэргэжлийн -- Technical and vocational
    6: high-school  # Тусгай мэргэжлийн дунд -- Specialized secondary
    7: degree       # Дээд -- Higher education ("Diploma" in the DDI)
  "2019":
    1: none         # No education
    2: school       # Primary
    3: school       # Lower secondary
    4: high-school  # Upper secondary
    5: high-school  # Vocational and technical
    6: high-school  # Specialized secondary
    7: degree       # Diploma
    8: degree       # Bachelor
    9: degree       # Master
    10: degree      # Doctoral
  "2011":
    1: none         # No education
    2: school       # Primary
    3: school       # Basic
    4: high-school  # Secondary
    5: high-school  # Technical and vocational
    6: high-school  # Specialized secondary
    7: degree       # Bachelor
    8: degree       # Master/ Doctor

# ISCO-08 major groups; "void" is set in mongolia.py for people not employed.
# Valid values: clerical, manual, managerial, operator, professional, service, other, technical, unknown, void
occupation:
  default:
    0: other         # Armed forces occupations
    1: managerial    # Managers
    2: professional  # Professionals
    3: technical     # Technicians and associate professionals
    4: clerical      # Clerical support workers
    5: service       # Service and sales workers
    6: manual        # Skilled agricultural, forestry and fishery workers
    7: manual        # Craft and related trades workers
    8: operator      # Plant and machine operators and assemblers
    9: manual        # Elementary occupations
