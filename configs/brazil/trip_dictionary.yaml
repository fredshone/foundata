# Trip-level dictionary for brazil (São Paulo Pesquisa Origem Destino 2017).

column_mappings:
  ID_PESS: pid
  N_VIAG: seq
  ZONA_O: ozone
  ZONA_D: dzone
  CO_O_X: o_x
  CO_O_Y: o_y
  CO_D_X: d_x
  CO_D_Y: d_y
  MOTIVO_O: oact
  MOTIVO_D: dact
  SERVIR_O: oescort  # 1: serving a passenger at origin
  SERVIR_D: descort  # 1: serving a passenger at destination
  MODOPRIN: mode
  H_SAIDA: tst_h
  MIN_SAIDA: tst_m
  H_CHEG: tet_h
  MIN_CHEG: tet_m
  DISTANCIA: distance  # straight line, metres
  ANDA_O: walk_o  # minutes walked at origin
  ANDA_D: walk_d  # minutes walked at destination

# applied to straight-line DISTANCIA
circuity: 1.3

# walking speed (km/h) for access/egress distances
walk_speed: 5

# activity mapping, used for both MOTIVO_O (oact) and MOTIVO_D (dact).
# Trips flagged by SERVIR_O/SERVIR_D (serving a passenger) become escort.
  # Valid values: home, work, education, shop, leisure, visit, escort, other, unknown
dact:
  1: work  # industry
  2: work  # commerce
  3: work  # services
  4: education
  5: shop
  6: other  # medical / dentist / health
  7: leisure  # recreation / visits / leisure
  8: home
  9: other  # job seeking
  10: other  # personal business
  11: shop  # meal

# mode mapping
  # Valid values: walk, bike, car, bus, rail, other, unknown
mode:
  1: rail  # metro
  2: rail  # train
  3: rail  # monorail
  4: bus  # São Paulo municipal bus
  5: bus  # other municipality bus
  6: bus  # metropolitan bus
  7: bus  # chartered
  8: bus  # school transport
  9: car  # car driver
  10: car  # car passenger
  11: car  # taxi
  12: car  # app taxi
  13: car  # motorcycle driver
  14: car  # motorcycle passenger
  15: bike
  16: walk
  17: other

# trip end locations (see foundata.location), as for homes: the origin and
# destination coordinates (CO_O_X/Y, CO_D_X/Y), else the OD 2017 zone
# (ZONA_O/ZONA_D)
trip_location:
  - level: point
    scale_m: 50
  - level: od_zone
    geo: od_zone_2017.parquet
