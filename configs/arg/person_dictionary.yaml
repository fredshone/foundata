# Person-level dictionary for arg (see hh_dictionary.yaml for the surveys).
# Every member of the hogar is listed; travel questions cover the day before
# the interview. Children under 3 were not asked about travel and are
# dropped (they still count in hh_size). Persons who refused or were absent,
# and persons who were outside the study area that day, are dropped too.

column_mappings:
  salta:
    ID_CP: pid
    ID_HOGAR: hid
    FEX: weight
    Edad_pers: age
    Sexo: sex
    Parentesco: relationship
    Máximo_nivel: education  # highest level reached, asked of non-students
    Nivel_est: education_current  # level being studied, asked of students
    Actividad_ppal: employment
    Lic_Cond: has_licence
    Dif_1: disability  # first difficulty listed; 7 = none
    Viajes: travelled
    No_viajes: no_trip_reason
  rc:
    ID_CP: pid
    ID_HOGAR: hid
    FEX: weight
    Edad: age
    Sexo: sex
    IV_parentesco: relationship
    IV_estudio_máximo_nivel: education
    IV_estudio_nivel: education_current
    IV_trabajo_tiempo_semana_pasada: employment
    IV_licencia_conducir: has_licence
    IV_dificultad_Ninguna: disability  # 1 = no difficulty
    IV_dificultad_anteojos: difficulty_seeing  # 1 = sí
    IV_dificultad_audifono: difficulty_hearing
    IV_dificultad_caminar: difficulty_walking
    IV_dificultad_agarrarobjeto: difficulty_grasping
    IV_dificultad_hablar: difficulty_speaking
    IV_dificultad_entender: difficulty_understanding
    IV_viajes_realizo: travelled
    IV_viajes_no_realizo_motivo: no_trip_reason
  nq:
    ID_CP: pid
    ID_HOGAR: hid
    FEX: weight
    Edad: age
    Sexo: sex
    Rel_Par: relationship
    Est_max: education
    Est_niv: education_current
    Act_ppal: employment
    Licencia_conducir: has_licence
    Dif_7: disability  # 1 = no difficulty
    Viajes_realizo: travelled
    Razón_no_viajes: no_trip_reason
  sfp:
    ID_CP: pid
    ID_HOGAR: hid
    FEX: weight
    C04A04b: age
    C04A04a: sex
    C04A05: relationship
    C04A11: education
    C04A09: education_current
    C05A03: employment
    C05A12: has_licence
    C04A07G: disability  # 1 = no difficulty
    ViajesRealizo: travelled
    C06A02: no_trip_reason
  enmodo:
    IDP: pid
    IDH: hid
    wt1: weight
    EDAD: age  # 999 unknown
    SEXO: sex
    RELACION: relationship
    NIVELEST: education
    OCUPPRI: employment
    LICENCIA: has_licence
    CDNINGUN: disability
    VIAJE: travelled  # also carries the reason for not travelling

# Ages above max_age are missing-value codes (ENMODO 999). Children under
# min_age weren't asked about travel.
max_age: 120
min_age: 3

# travelled mapping: persons mapped to "yes" or "no" are kept; everything
# else (under 3, absent, refused, outside the study area, unmapped) is
# dropped. "away" marks persons outside the study area that day.
travelled:
  default:
    1: "yes"  # sí
    2: "no"  # no
  enmodo:
    1: "yes"  # sí
    2: "no"  # enfermedad
    3: "no"  # vacaciones / franco
    4: "no"  # no trabaja
    5: "no"  # no tiene plata para viajar
    6: "no"  # no posee modo de transporte
    7: "no"  # trabaja en su casa
    8: "no"  # paro
    9: "no"  # discapacitado y no posee medio
    10: "no"  # no tuvo clases
    11: away  # fuera del área de estudio
    12: "no"  # otro
    # 0 menor de 3 años: dropped

# no_trip_reason codes for "estuvo fuera del área" (outside the study area),
# whose day isn't a stay-at-home day.
away_reasons:
  default: [11]
  salta: [6]
  rc: [6]
  enmodo: []

# sex mapping
  # Valid values: male, female, other, unknown
sex:
  default:
    1: male  # varón
    2: female  # mujer
  enmodo:
    Masculino: male
    Femenino: female

# relationship mapping (relación de parentesco con el jefe de hogar)
  # Valid values: self, partner, child, parent, sibling, unrelated, relative, other, unknown
relationship:
  default:
    -97: unrelated  # otro no pariente
    1: self  # jefe(a) de hogar
    2: partner  # esposo(a) / compañero(a)
    3: child  # hijo(a) / hijastro(a)
    4: relative  # otro pariente
    5: unrelated  # empleado(a) doméstico(a)
    6: unrelated  # pensionista o huésped / visitante
  enmodo:
    1: self  # jefe de hogar
    2: partner  # cónyuge
    3: child  # hijo(a) / hijastro(a)
    4: relative  # nieto(a)
    5: parent  # madre / padre
    6: sibling  # hermano(a)
    7: relative  # yerno / nuera
    8: relative  # suegro(a)
    9: relative  # otro parentesco
    10: unrelated  # pensionista
    11: unrelated  # servicio doméstico
    13: unrelated  # amigo(a) / comparte vivienda
    14: unrelated  # visitante
    15: other  # otro

# education mapping (máximo nivel alcanzado). The EMDs only ask it of
# persons not currently studying; students use education_current below.
# Levels are not split into complete/incomplete.
  # Valid values: some, none, school, high-school, degree, unknown, void
education:
  default:
    -97: unknown  # otro
    1: none  # sin estudios
    2: school  # primario
    3: school  # EGB
    4: high-school  # secundario / polimodal / EGB2 / EGB3
    5: degree  # terciario o superior no universitario
    6: degree  # superior universitario o universitario
    7: degree  # post universitario
    8: unknown  # educación especial
  enmodo:
    1: none  # sin estudios
    2: some  # primario incompleto / EGB incompleto
    3: school  # primario completo / EGB completo
    4: school  # secundario incompleto / polimodal incompleto
    5: high-school  # secundario completo / polimodal completo
    6: high-school  # terciario incompleto
    7: degree  # terciario completo
    8: high-school  # universitario incompleto
    9: degree  # universitario completo
    10: degree  # estudios de postgrado
    11: unknown  # educación no formal
    12: unknown  # otros

# education_current mapping (nivel que cursa actualmente): the level below
# the one being studied has been completed.
  # Valid values: some, none, school, high-school, degree, unknown, void
education_current:
  default:
    -97: unknown  # otro
    1: none  # jardín de infantes / maternal
    2: some  # primario
    3: some  # EGB
    4: school  # secundario / polimodal / EGB2 / EGB3
    5: high-school  # terciario o superior no universitario
    6: high-school  # superior universitario o universitario
    7: degree  # post universitario
    8: unknown  # educación especial
    9: unknown  # educación no formal

# employment mapping (actividad la mayor parte del tiempo la semana pasada,
# asked of persons aged 15+; younger persons are set by
# utils.correct_child_employment)
  # Valid values: employed, unemployed, retired, student, unknown, void
employment:
  default:
    -97: unknown  # otro
    97: unknown  # otro
    1: employed  # trabajar
    2: employed  # no trabajó pero mantiene el empleo
    3: unemployed  # buscó trabajo
    4: unemployed  # ama de casa
    5: student  # estudió
    6: unemployed  # rentista
    7: retired  # jubilado
    8: retired  # pensionado
    9: unemployed  # inactivo por discapacidad permanente
  salta:
    -97: unknown  # otro
    1: employed  # trabajar
    2: employed  # no trabajó pero mantiene el empleo
    3: unemployed  # buscó trabajo
    4: unemployed  # ama de casa
    5: student  # estudió
    6: unemployed  # rentista
    7: retired  # jubilado
    8: retired  # pensionado
    9: unemployed  # inactivo por discapacidad
    10: void  # miembro menor de 3 años
    11: void  # miembro de 3 a 14 años
    12: unknown  # ausente
    13: unknown  # rechazo
  enmodo:
    0: void  # menor de 14 años
    1: employed  # trabaja
    2: retired  # jubilado / pensionado
    3: unemployed  # desocupado (busca trabajo)
    4: unemployed  # no trabaja (no busca trabajo)
    5: unemployed  # rentista
    6: student  # estudiante
    7: unemployed  # ama de casa
    8: unemployed  # inactivo por discapacidad
    9: unknown  # beneficiario de algún plan social
    10: employed  # no trabajó, pero mantiene el empleo
    90: unknown  # Ns/Nc

# has_licence mapping (licencia de conducir)
  # Valid values: yes, no, unknown, void
has_licence:
  default:
    1: "yes"  # sí
    2: "no"  # no
  salta:
    1: "yes"  # sí
    2: "no"  # no
    10: void  # miembro menor de 3 años
    11: void  # miembro de 3 a 14 años
  enmodo:
    0: void  # no aplica
    1: "yes"  # auto
    2: "yes"  # camión / colectivo
    3: "yes"  # moto
    4: "no"  # no tiene

# disability mapping (dificultad para ver, oír, caminar, agarrar objetos,
# hablar o entender). Where the individual difficulty_* flags are mapped
# (Resistencia-Corrientes), any flag set means "yes" and the "ninguna" column
# only decides the rest: 1,724 persons there have neither set.
  # Valid values: yes, no, unknown
disability:
  default:
    0: "yes"  # "no tiene ninguna dificultad": no
    1: "no"  # "no tiene ninguna dificultad": sí
  salta:
    1: "yes"  # dificultad aún con anteojos
    2: "yes"  # dificultad aún con audífono
    3: "yes"  # dificultad caminar o subir escalones
    4: "yes"  # dificultad agarrar objetos
    5: "yes"  # dificultad hablar
    6: "yes"  # dificultad entender y/o aprender
    7: "no"  # no tiene ninguna dificultad
  rc:
    0: unknown  # "ninguna": no, but no difficulty flagged either
    1: "no"  # "ninguna": sí
  enmodo:
    0: "yes"  # tiene capacidad diferente
    1: "no"  # no tiene
