# Trip-level dictionary for TUS (India, Time Use Survey), covering both the
# 2024 and 2019 rounds -- both use the same ICATUS 2016 3-digit activity
# codes, so act_mappings/travel_codes below are shared across rounds (hence
# the single "default" key, not a year-keyed one).
#
# TUS is a time-use diary, not a conventional trip survey: each person's day
# is a sequence of ~15-45 minute activity episodes (tus106PER rows in 2024,
# NSS Block 6 rows in 2019), coded with a 3-digit ICATUS 2016 activity code
# (Activity_Code_3Digit in 2024, b6q10 in 2019). ICATUS
# reserves one specific code per major division for "travelling time
# related to <that division's activities>" -- travel_codes below lists all
# 10 of them. tus.py treats every diary episode coded with one of those as
# a trip, and every other episode as an activity; act_mappings classifies
# every other code into the template's activity-purpose vocabulary. Since a
# diary routinely has several different stationary activities in a row
# between two trips (e.g. rest, then eat, then nap, all at home, with no
# trip between them), a trip's oact/dact are not simply the nearest
# episode -- every maximal run of consecutive non-travel episodes between
# two trips is squashed into a single activity, picking the act type with
# the longest *total* duration in that run (see tus.py::load_trips). Both
# the preceding trip's dact and the following trip's oact are read off
# that same squashed value, so by construction every trip's dact equals
# the next trip's oact and filter.activity_consistency should never drop
# a TUS plan.
#
# Columns used directly (not through column_mappings, since trips aren't a
# separate raw file here): Activity_Serial_No (episode order),
# Major_Activity_Flag (keep only "1" -- ICATUS lets a slot carry a second,
# simultaneous "2" activity, which would otherwise double-count time or
# create overlapping timestamps), Time_From/Time_To (HH:MM clock time).
#
# TUS captures no transport mode and no trip distance at all, so every
# trip's mode is "unknown" and distance is always null -- both allowed by
# the template (mode default: True; distance has no "set" constraint and
# avg_speed/feasibility checks downstream degrade gracefully to null when
# distance is null). Because mode is never anything but "unknown",
# `filter.missing_acts_or_modes` is deliberately NOT applied to TUS in
# run.py -- it would drop every single plan.
#
# ozone/dzone: TUS records only whether an activity happened inside/outside
# the dwelling (Activity_Location), not an urban/rural classification of
# *where* outside -- so there is no real per-trip zone signal. tus.py uses
# the person's own household hh_zone (rural/urban) for both ozone and dzone
# as the least-wrong available proxy, on the assumption that most within-day
# travel does not cross the rural/urban boundary.

